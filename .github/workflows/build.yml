name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch supersedes the run already in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  # Analyzer, formatter and unit tests. Fast, no Android toolchain needed, so
  # it fails in ~1 minute rather than waiting on a Gradle build.
  check:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # One APK per ABI, on every push. A universal APK ships all three
  # architectures' native code to every device, which is most of the download
  # for a Flutter app.
  #
  # Debug-signed: no upload keystore exists yet (see README > Signing), so
  # these sideload for testing but cannot go to Google Play.
  apks:
    name: split apks
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned rather than "latest": the Android Gradle Plugin only
          # supports a trailing window of JDK releases, and a runner image
          # bumping its default JDK should not break the build.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p dist
          label="${GITHUB_SHA::7}"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            # Fail loudly rather than shipping a partial set that looks
            # complete until someone needs the missing architecture.
            test -f "$src" || { echo "::error::missing $src"; exit 1; }
            mv "$src" "dist/logistics-${label}-${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: logistics-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
