name: build

on:
  push:
    branches: [main]
    # Tags drive releases: pushing v1.0.0-beta.1 publishes a prerelease.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same branch supersedes the run already in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  # Analyzer, formatter and unit tests. Fast, no Android toolchain needed, so
  # it fails in ~1 minute rather than waiting on a Gradle build.
  check:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # Debug APK only. A debug build is signed automatically with the SDK's
  # generated debug key, so this job needs no keystore and no secrets. Adding
  # a release build here would mean putting a real signing key in GitHub
  # secrets — see README before doing that.
  android:
    name: debug apk
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned rather than "latest": the Android Gradle Plugin only
          # supports a trailing window of JDK releases, and a runner image
          # bumping its default JDK should not break the build.
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Runs only for a pushed v* tag. Publishes a GitHub prerelease with the APK
  # attached. Uses the built-in GITHUB_TOKEN, so there is nothing to configure.
  #
  # The APK is an AOT release build but is signed with the debug key, because
  # no upload keystore exists yet (see README > Signing). That is fine for
  # sideloading to testers and is stated plainly in the release notes; it
  # cannot go to Play until a real key is wired up. Every tag is marked
  # prerelease for that reason.
  prerelease:
    name: publish prerelease
    runs-on: ubuntu-latest
    needs: [check, android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # One APK per ABI rather than a fat universal one: a universal build
      # ships all three architectures' native code to every device, which is
      # most of the download for a Flutter app.
      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi

      - name: Name the artifacts after the tag
        run: |
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            # Fail loudly rather than publishing a release that is quietly
            # missing an architecture.
            test -f "$src" || { echo "::error::missing $src"; exit 1; }
            mv "$src" "dist/logistics-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -lh dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.apk \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --notes "
          > **Prerelease — sideload only.**
          > These APKs are signed with the Android **debug** key, not an
          > upload key, so they install for testing but cannot be published to
          > Google Play. See \`README.md\` > Signing.

          ### Which file do I want?

          | File | For |
          | --- | --- |
          | \`arm64-v8a\` | Almost every phone made since ~2017. **Start here.** |
          | \`armeabi-v7a\` | Older 32-bit devices. |
          | \`x86_64\` | Emulators and x86 Chromebooks. |

          Install with \`adb install logistics-${GITHUB_REF_NAME}-arm64-v8a.apk\`,
          or copy it to the device and allow installs from unknown sources.

          Installing the wrong ABI fails with \`INSTALL_FAILED_NO_MATCHING_ABIS\`
          — that is the wrong file, not a broken build.
          "
